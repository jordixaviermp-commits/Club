# Los proyectos gratuitos de Supabase se pausan tras unos días sin uso.
# Esto hace una consulta mínima dos veces por semana para mantenerlo despierto.
# Lee la dirección y la clave pública de js/config.js: no hay que configurar nada más.
name: Mantener Supabase despierto
on:
  schedule:
    - cron: '17 6 * * 1,4'   # lunes y jueves, 06:17 UTC
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          url=$(sed -n "s/.*SUPABASE_URL: *'\([^']*\)'.*/\1/p" js/config.js)
          key=$(sed -n "s/.*SUPABASE_KEY: *'\([^']*\)'.*/\1/p" js/config.js)
          if [ -z "$url" ] || [ -z "$key" ]; then echo "config.js sin rellenar: nada que hacer"; exit 0; fi
          curl -fsS -X POST "$url/rest/v1/rpc/ping" -H "apikey: $key" -H "Content-Type: application/json" -d '{}'
